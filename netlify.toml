[build]
  command = "npx prisma generate --schema=backend/prisma/schema.prisma && npm run build --workspace=frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_ENV = "production"
  NETLIFY = "true"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    ".prisma/client",
    "jsdom"
  ]
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/jsdom/lib/jsdom/browser/default-stylesheet.css"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200