[build]
  command = "npx prisma generate --schema=backend/prisma/schema.prisma && npm run build --workspace=frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_ENV = "production"
  NETLIFY = "true"
  # NODE_ENV=production makes npm's implicit install step skip devDependencies
  # (typescript, vite, etc.), which is what caused "tsc: not found". This
  # forces devDependencies to install regardless of NODE_ENV.
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma/client"]
  included_files = [
    "node_modules/.prisma/client/**",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
